name: Workflow Checks

on:
  push:
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '25 10 * * 1' # weekly, so CodeQL picks up new/updated queries even without workflow changes

permissions:
  contents: read

jobs:
  actionlint:
    # Only relevant when workflow files actually changed - schedule exists solely for the codeql job below.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  codeql:
    name: CodeQL (actions)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
