name: Choco Auto Update

on:
  schedule:
    - cron:  '0 0 * * 1' # temporarily, run less often since Chocolatey moderation/approval is currently very slow
  push:
    # Renovate here uses automergeType "branch": it pushes commits directly to renovate/* branches
    # (never opens a pull request), so push - not pull_request - is the correct dry-run validation trigger.
    branches-ignore:
      - main
    paths:
      - '.github/workflows/autoupdate_all.yml'
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: Which package to update? (all = run full matrix)
        default: all
        options:
          - all
          - github-copilot-cli
          - go-containerregistry
          - golden-cheetah
          - foldersync-desktop
          - px-proxy
          - token2-companion
      dry_run:
        type: boolean
        description: Dry run (skip publishing and pushing to main)?
        default: false

defaults:
  run:
    shell: pwsh

concurrency:
  group: choco-auto-update-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  get_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build filtered matrix
        id: set
        run: |
          $all = @(
            @{ package = 'github-copilot-cli'; testable = $true  }
            @{ package = 'foldersync-desktop'; testable = $false }
            @{ package = 'go-containerregistry'; testable = $true }
            @{ package = 'golden-cheetah'; testable = $true }
            @{ package = 'px-proxy'; testable = $true  }
            @{ package = 'token2-companion';   testable = $true  }
          )
          $inputPackage = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.package }}' } else { 'all' }
          $filtered = if (-not $inputPackage -or $inputPackage -eq 'all') {
            $all
          } else {
            $all | Where-Object { $_.package -eq $inputPackage }
          }
          $matrix = [ordered]@{ include = @($filtered) } | ConvertTo-Json -Compress
          "matrix=$matrix" >> $Env:GITHUB_OUTPUT

  update_choco_auto:
    needs: get_matrix
    name: update_${{ matrix.package }}
    runs-on: windows-latest

    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      pull-requests: write

    env:
      # push (Renovate automerge branches) is always a dry run; schedule is always a real run;
      # workflow_dispatch is real by default but can be forced into dry-run mode via the input.
      # Note: 'permissions' cannot be scoped conditionally like this - only 'if:' step guards can.
      DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get_matrix.outputs.matrix) }}

    steps:
      - name: Get bot user identity
        uses: mu88/common/.github/actions/get-bot-identity@3acb6a732366cfadf93cd1a029a2ae590d6a4f16
        id: bot-identity
        with:
          client-id: ${{ vars.MU88_BOT_APP_ID }}
          private-key: ${{ secrets.MU88_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.bot-identity.outputs.token }}

      - name: Install Chocolatey Automatic Package Updater Module
        run: Install-Module -Name Chocolatey-AU -Force

      - name: Run ${{ matrix.package }} update script
        id: update
        run: |
          Set-Location _auto\${{ matrix.package }}
          $UpdateOutput = .\update.ps1 -GitHubToken ${{ secrets.GITHUB_TOKEN }}
          $NupkgPath = (($UpdateOutput.Result | Where-Object {$_ -like '*.nupkg''*'}) -split "'")[1]
          $NewVersion = $UpdateOutput.RemoteVersion

          if ($NupkgPath) {
            $UpdateStatus = 'Update Available'
          } elseif ($UpdateOutput.Result -match 'already exists in the Chocolatey community feed') {
            # AU aborts early when the remote version already exists in the Chocolatey community feed,
            # leaving local nuspec/install files unpatched. To bring the repo back in sync we must
            # re-run with a fake gallery URL so AU's feed-existence check throws and is swallowed,
            # allowing AU to apply au_SearchReplace and patch the nuspec/install files.
            # We then commit the patched files but intentionally skip all feed pushes
            # (the version is already published there).
            $env:au_GalleryPackageRootUrl = 'https://localhost'
            $UpdateOutput = .\update.ps1 -GitHubToken ${{ secrets.GITHUB_TOKEN }}
            Remove-Item Env:\au_GalleryPackageRootUrl
            # The nupkg must not be published - the version already exists in all feeds.
            # Delete it immediately so no publish step can accidentally push it.
            $SyncNupkgPath = (($UpdateOutput.Result | Where-Object {$_ -like '*.nupkg''*'}) -split "'")[1]
            if ($SyncNupkgPath -and (Test-Path $SyncNupkgPath)) { Remove-Item $SyncNupkgPath -Force }
            $NupkgPath = ''
            $NewVersion = $UpdateOutput.RemoteVersion
            $UpdateStatus = 'Sync Nuspec'
          } else {
            $UpdateStatus = 'No Update'
          }

          Write-Output "NupkgPath=$($NupkgPath)" >> $Env:GITHUB_OUTPUT
          Write-Output "NewVersion=$($NewVersion)" >> $Env:GITHUB_OUTPUT
          Write-Output "UpdateStatus=$($UpdateStatus)" >> $Env:GITHUB_OUTPUT

      - name: Pack ${{ matrix.package }} for testing (manual trigger or push dry run)
        id: pack_for_test
        # Forces a test pack+install even without an actual upstream update - used for manual
        # workflow_dispatch runs and for push dry runs (e.g. to smoke-test action version bumps).
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && matrix.testable && steps.update.outputs.UpdateStatus == 'Update Available' && steps.update.outputs.NupkgPath == '' }}
        run: |
          Set-Location _auto\${{ matrix.package }}
          $PackOutput = choco pack
          $NupkgPath = (($PackOutput | Where-Object {$_ -like '*.nupkg''*'}) -split "'")[1]
          Write-Output "NupkgPath=$($NupkgPath)" >> $Env:GITHUB_OUTPUT

      - name: Test and publish ${{ matrix.package }}
        # Union of the two conditions the extracted steps used to have individually - the
        # composite action re-applies each one internally via the testable/dry-run inputs,
        # so within a single invocation testing and publishing can still be gated independently,
        # exactly like the two conditions did before this was one action, e.g. a forced
        # smoke-test pack (workflow_dispatch/push) can run the Test step without ever publishing.
        if: ${{ (matrix.testable && (steps.update.outputs.NupkgPath != '' || steps.pack_for_test.conclusion == 'success')) || (steps.update.outputs.UpdateStatus == 'Update Available' && env.DRY_RUN != 'true') }}
        uses: ./.github/actions/pack-test-publish
        with:
          package: ${{ matrix.package }}
          nupkg-path: ${{ steps.update.outputs.NupkgPath || steps.pack_for_test.outputs.NupkgPath }}
          testable: ${{ matrix.testable }}
          dry-run: ${{ env.DRY_RUN }}
          install-au-module: 'false' # already installed above to run update.ps1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          choco-key: ${{ secrets.CHOCO_KEY }}

      - name: Prepare ${{ matrix.package }} update artifact
        # Skipped on dry run - never hand nuspec/README changes to the commit job from an unverified Renovate branch
        id: prepare_artifact
        if: ${{ (steps.update.outputs.UpdateStatus == 'Update Available' || steps.update.outputs.UpdateStatus == 'Sync Nuspec') && env.DRY_RUN != 'true' }}
        run: |
          # Metadata travels alongside the changed package files in the same artifact, because matrix
          # job outputs are not aggregated by GitHub Actions (only the last matrix leg's outputs survive
          # in needs.*.outputs) - the commit_changes job can only learn what happened via the artifact.
          $Meta = [ordered]@{
            package    = '${{ matrix.package }}'
            newVersion = '${{ steps.update.outputs.NewVersion }}'
          }
          $Meta | ConvertTo-Json | Set-Content -Path '_auto\${{ matrix.package }}\.update-meta.json'

      - name: Upload ${{ matrix.package }} update artifact
        if: ${{ steps.prepare_artifact.conclusion == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-${{ matrix.package }}
          path: _auto/${{ matrix.package }}
          retention-days: 1
          if-no-files-found: error

  commit_changes:
    name: Commit and push package updates
    needs: update_choco_auto
    # Runs even if individual matrix legs failed (fail-fast: false), so unrelated package
    # updates still get committed. Never runs for dry runs - those never upload artifacts,
    # but skipping the job outright avoids an unnecessary checkout/download roundtrip.
    if: ${{ always() && !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)) }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Get bot user identity
        uses: mu88/common/.github/actions/get-bot-identity@3acb6a732366cfadf93cd1a029a2ae590d6a4f16
        id: bot-identity
        with:
          client-id: ${{ vars.MU88_BOT_APP_ID }}
          private-key: ${{ secrets.MU88_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.bot-identity.outputs.token }}

      - name: Check for pending package updates
        # Distinguishes "no package produced an update this run" (expected, nothing to do) from a
        # real failure to reach the artifact API - continue-on-error on the download step itself
        # would have masked both cases identically as "nothing to commit", silently dropping updates.
        id: check
        env:
          GH_TOKEN: ${{ steps.bot-identity.outputs.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $artifactNames = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name'
          $hasUpdates = [bool]($artifactNames | Where-Object { $_ -like 'update-*' })
          "has_updates=$($hasUpdates.ToString().ToLower())" >> $Env:GITHUB_OUTPUT

      - name: Download package update artifacts
        if: ${{ steps.check.outputs.has_updates == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: _incoming
          pattern: update-*

      - name: Apply package updates and commit
        env:
          BOT_NAME: ${{ steps.bot-identity.outputs.name }}
          BOT_EMAIL: ${{ steps.bot-identity.outputs.email }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          if (-not (Test-Path '_incoming')) {
            Write-Output 'No package update artifacts found - nothing to commit.'
            exit 0
          }

          git config --local user.name $env:BOT_NAME
          git config --local user.email $env:BOT_EMAIL

          # Sorted for deterministic, reproducible commit ordering across runs.
          $incomingDirs = Get-ChildItem -Path '_incoming' -Directory -Filter 'update-*' | Sort-Object Name
          $anyCommitted = $false

          foreach ($dir in $incomingDirs) {
            $metaPath = Join-Path $dir.FullName '.update-meta.json'
            if (-not (Test-Path $metaPath)) {
              Write-Warning "No metadata found in '$($dir.Name)' - skipping."
              continue
            }

            $meta = Get-Content -Raw -Path $metaPath | ConvertFrom-Json
            Remove-Item -Path $metaPath -Force

            $targetDir = "_auto/$($meta.package)"
            Copy-Item -Path (Join-Path $dir.FullName '*') -Destination $targetDir -Recurse -Force

            if (-not (git status --porcelain -- $targetDir)) {
              Write-Warning "No file changes for '$($meta.package)' - skipping commit."
              continue
            }

            git add -- $targetDir
            git commit -m "feat($($meta.package)): upgrade to v$($meta.newVersion)"
            $anyCommitted = $true
          }

          if (-not $anyCommitted) {
            Write-Output 'No package changes to commit.'
            exit 0
          }

          # Regenerated once, after all package commits, from a single writer - so README.md can
          # never conflict between packages the way per-package README patches used to.
          ./build/Sync-ReadmeVersion.ps1
          if (git status --porcelain -- README.md) {
            git add README.md
            git commit -m 'chore: sync README package versions'
          }

          # Retry-with-rebase only guards against a *different* workflow run racing this one
          # (e.g. a manual dispatch overlapping the schedule) - within a single run, this job
          # is the only writer to the default branch, so there is nothing to rebase away here.
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $PSNativeCommandUseErrorActionPreference = $false
            git push origin "HEAD:refs/heads/$($env:DEFAULT_BRANCH)"
            $pushExitCode = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $true

            if ($pushExitCode -eq 0) { exit 0 }

            if ($attempt -eq $maxAttempts) {
              throw "Could not push to $($env:DEFAULT_BRANCH) after $maxAttempts attempts."
            }

            Write-Warning "Push attempt $attempt/$maxAttempts rejected - retrying after rebase."
            Start-Sleep -Seconds (5 * $attempt)
            git fetch origin $env:DEFAULT_BRANCH
            git rebase "origin/$($env:DEFAULT_BRANCH)"
          }
